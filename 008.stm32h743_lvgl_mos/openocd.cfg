# =============================================================================
#  OpenOCD configuration for the STM32H743ZIT6 LVGL menu + NES emulator
#    - ST-Link (V2 or V3) over SWD
#    - target: STM32H7x
#
#  Used by:
#    * VS Code cortex-debug  -> "configFiles": ["${workspaceFolder}/openocd.cfg"]
#    * Command line flash    -> openocd -f openocd.cfg -c "program build/nes_h743.elf verify reset exit"
#
#  The interface / target scripts ship with OpenOCD and are resolved from its
#  own script search path, so this file contains NO absolute paths.
# =============================================================================

source [find interface/stlink.cfg]

# Select SWD explicitly (otherwise OpenOCD prints a DEPRECATED auto-select warning).
transport select swd

source [find target/stm32h7x.cfg]

# Note: no explicit `init`/`halt` here.  OpenOCD initialises the target
# automatically, and cortex-debug manages halt/reset itself.  For command line
# flashing this file is used as:
#   openocd -f openocd.cfg -c "program build/nes_h743.elf verify reset exit"
