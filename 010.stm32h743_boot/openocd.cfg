# ============================================================================
# OpenOCD configuration  -  DEBUG / ATTACH (used by VSCode Cortex-Debug)
# Target: STM32H743ZIT6 on LXB743ZI-P1 board, ST-Link V2, SWD transport
# This file only brings up the debug server; flashing is done by Cortex-Debug
# (it loads build/stm32_qspi.elf itself). For standalone flashing use
# `openocd_flash.cfg` or the "Flash (openOCD)" VSCode task.
# ============================================================================
source [find interface/stlink.cfg]
transport select swd

source [find target/stm32h7x.cfg]

# 64KB working area in internal SRAM for flash algorithms
set WORKAREASIZE 0x10000

# STM32H7 needs SRST-only reset with the ST-Link
reset_config srst_only

# SWD clock: 4 MHz is safe and fast enough for debug
adapter speed 4000

# Allow Cortex-Debug / gdb to connect
init
