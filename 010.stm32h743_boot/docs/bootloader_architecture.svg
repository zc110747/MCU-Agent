<text x="462" y="214" fill="#B4B2A9" font-size="11" font-family="monospace">test_app/stm32h7_app.ld</text>
<rect x="452" y="228" width="196" height="48" rx="8" fill="#444441" stroke="#888780" stroke-width="0.5"/>
