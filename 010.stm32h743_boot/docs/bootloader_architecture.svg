<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="20" y="16" width="640" height="544" rx="20" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>

<text x="36" y="42" fill="#D3D1C7" font-size="14" font-family="monospace" font-weight="500">STM32H743ZIT6 Bootloader — 整体框架 (QSPI U盘 + 安全升级)</text>

