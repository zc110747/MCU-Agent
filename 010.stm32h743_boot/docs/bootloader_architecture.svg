<svg viewBox="0 0 680 560" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>STM32H743 Bootloader 整体框架</title>
<desc>分层: 应用层 / BSP驱动层 / 第三方库 / HAL-CMSIS / 硬件, 右侧为内部Flash内存布局, 底部为硬件资源</desc>
<defs>
