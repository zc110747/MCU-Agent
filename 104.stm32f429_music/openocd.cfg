# STM32F429IGT6 调试/烧录配置 —— ST-Link (SWD)
# 路径说明：所有引用均通过 OpenOCD 内置 [find] 解析（基于 searchDir），
# 不写死本机绝对路径；工具链本体路径由 VSCode/任务通过环境变量注入。
#
# 用法：
#   openocd -s <OPENOCD_SCRIPTS> -f openocd/stm32f429_stlink.cfg
# 常驻调试服务器（供 gdb :3333 / telnet :4444）：
#   openocd -s <OPENOCD_SCRIPTS> -f openocd/stm32f429_stlink.cfg

source [find interface/stlink.cfg]
transport select swd
source [find target/stm32f4x.cfg]

# ST-Link V2-1 常见速率；如不稳定可下调到 1000
adapter speed 2000

# Nucleo 板载 ST-Link 通过 NRST 线控复位；保留默认 reset_config 即可。
# 烧录/调试完成后由 gdb 或 telnet 下发 reset run。
