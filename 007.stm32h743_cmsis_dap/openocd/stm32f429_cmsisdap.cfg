# ---------------------------------------------------------------------------
# OpenOCD - drive an STM32F429 target THROUGH this project's CMSIS-DAP probe.
#
# This is the acceptance test: the adapter here is our own STM32H743 firmware,
# not an ST-Link.
#
#   openocd -f openocd/stm32f429_cmsisdap.cfg                  # GDB server
#   openocd -f openocd/stm32f429_cmsisdap.cfg \
#           -c "program app.elf verify reset exit"             # flash the F429
#
# Wiring (probe -> target):
#   PA1  SWCLK  -> SWCLK
#   PA0  SWDIO  -> SWDIO
#   PA2  NRST   -> NRST      (REQUIRED - see reset_config note below)
#   GND         -> GND       (must be common)
#
# NRST is REQUIRED, not optional: the F429 core can go to sleep with its debug
# clock gated, and only a real nRESET pulse (not a software reset) can power the
# debug domain back on. Without NRST wired, "program ... reset" fails with
# "the corresponding core might be turned off".
# ---------------------------------------------------------------------------

adapter driver cmsis-dap

# Force the HID (v1) backend. Without this OpenOCD tries the bulk/v2 backend
# first and only falls back after a timeout.
cmsis-dap backend hid

# Keil's CMSIS-DAP identity, as reported by app/usb_descriptors.c. OpenOCD also
# auto-detects any HID device whose product string contains "CMSIS-DAP", so this
# line is a speed-up rather than a requirement.
cmsis-dap vid_pid 0xC251 0xF001

transport select swd

# 1 MHz to start with. The firmware derives SWCLK from the DWT cycle counter, so
# the requested speed is honoured accurately; push it up once the link is proven
# (2000-4000 works over short, well-grounded jumpers).
adapter speed 1000

set CHIPNAME stm32f429
source [find target/stm32f4x.cfg]

# ---------------------------------------------------------------------------
# Reset wiring
#
# The probe drives the target nRESET (F429 NRST) from PA2 as an open-drain
# line, and our firmware now implements DAP_ResetTarget by toggling that pin.
# A *hardware* nRESET is required here because the F429 core can go to sleep
# with its debug domain clock-gated; a software (SYSRESETREQ) reset cannot
# power the debug block back on, which is exactly what made the flash/download
# step fail with "the corresponding core might be turned off".
#
# srst_only          -> use the target nRESET line for resets, not a software reset
# srst_open_drain    -> matches the probe's open-drain PA2 driver
# srst_nogate        -> assert nRESET even while the target is not connected
# connect_assert_srst -> KEEP nRESET asserted while connecting. The F429 may be
#                        running firmware that idles into STOP and gates its debug
#                        clock, so we must NOT let it boot. Holding nRESET low keeps
#                        the core parked at the reset vector with the debug domain
#                        powered, so "reset halt" can actually halt it (otherwise the
#                        firmware boots, enters STOP, and "reset halt" reports
#                        "Not halted" / "core might be turned off").
reset_config srst_only srst_open_drain srst_nogate connect_assert_srst

# The F429 may be running firmware that idles into a low-power mode and gates
# its debug clock, so a *software* reset can't bring the core back - we rely on
# the nRESET pulse (srst_only above). vectreset makes "reset halt" latch the halt
# request while the core is still held in reset (connect_assert_srst above), so
# the core stops right at the reset vector instead of booting into sleep.
cortex_m reset_config vectreset
