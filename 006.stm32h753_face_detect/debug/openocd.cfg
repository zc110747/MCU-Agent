# OpenOCD configuration for the LXB743ZI-P1 (STM32H743ZIT6) over ST-Link.
#
# Used for command line flashing / probing:
#   openocd -f debug/openocd.cfg -c "program build/debug/stm32h7_face_detect.elf verify reset exit"
#
# The Cortex-Debug launches in .vscode/launch.json reference the stock
# interface/stlink.cfg + target/stm32h7x.cfg instead, which is the combination
# proven to work on this board.  Transport is left at the stlink default
# (dapdirect_swd on OpenOCD 0.12); do NOT force hla_swd, newer ST-Link probes
# reject it.

source [find interface/stlink.cfg]

# ST-Link on OpenOCD 0.12 speaks SWD via dapdirect; select it explicitly to
# silence the auto-select deprecation warning.
transport select swd

source [find target/stm32h7x.cfg]

# 4 MHz is reliable with the short flying leads these boards ship with.
adapter speed 4000

# Halt the core out of reset so the first instruction can be stepped, and keep
# the reset line usable on the H7.
reset_config srst_only srst_nogate connect_assert_srst
