# RA8D1 Vision Board - OpenOCD target config (Cortex-M85, SWD via CMSIS-DAP/ART-Link)
# Usage: openocd -f openocd.cfg
# Debug: gdb port 3333, telnet port 4444
# Note: flash programming is done with pyOCD (see pyocd.yaml / pyocd_user.py)

adapter driver cmsis-dap
transport select swd
adapter speed 4000

set CHIPNAME ra8d1
swd newdap $CHIPNAME cpu -irlen 0 -ircapture 0x1 -irmask 0x0
dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu
target create $CHIPNAME.cpu cortex_m -dap $CHIPNAME.dap
cortex_m reset_config sysresetreq

# Note: no gdb-attach "reset halt" event here. It races with the gdb attach
# handshake (continue then never resumes). The debugger issues the reset itself
# (cortex-debug: overrideLaunchCommands -> "monitor reset halt").

# OpenOCD has no flash bank for RA8D1, so software (memory-write) breakpoints
# cannot be inserted into code flash. Force gdb's breakpoint requests onto the
# core's FPB hardware breakpoints (8 available on Cortex-M85).
gdb_breakpoint_override hard
