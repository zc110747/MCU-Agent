# =============================================================================
# Zephyr web server demo -- STM32F429IGT6 + LAN8720A (RMII)
# Board: stm32f429ig (project-local board, see boards/stm32f429ig)
# =============================================================================

# ---- Kernel / libc ---------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# ---- Console / logging (USART1 PA9/PA10) ----------------------------------
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=y

# ---- GPIO / LED / I2C ------------------------------------------------------
CONFIG_GPIO=y
CONFIG_LED=y
CONFIG_I2C=y

# ---- External SDRAM (FMC bank 1, W9825G6KH-6 32 MB) -----------------------
# The controller is brought up by the STM32 FMC driver; app/sdram.c then
# self-tests the chip and exposes an 8 MB k_heap on top of it.
CONFIG_MEMC=y
# Lets app/sdram.c report the free bytes of the SDRAM k_heap over HTTP.
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# ---- Networking core -------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_ARP=y
CONFIG_NET_DRIVERS=y

# STM32 HAL Ethernet (F4 series, official STM32Cube HAL API v2)
CONFIG_ETH_STM32_HAL=y
CONFIG_ETH_STM32_HAL_API_V2=y

# ---- Static IPv4 configuration (applied automatically at boot) -------------
# NET_CONFIG_SETTINGS gates the whole NET_CONFIG_* block, so it must be on.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.10.8"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.10.1"

# ---- Network buffer sizing (small and deterministic for a demo) ------------
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_BUF_DATA_SIZE=128
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=6
CONFIG_NET_SOCKETS_POLL_MAX=4
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_IF_MCAST_IPV4_ADDR_COUNT=1
CONFIG_NET_TCP_TIME_WAIT_DELAY=0

# ---- Build outputs ---------------------------------------------------------
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_BUILD_OUTPUT_HEX=y
