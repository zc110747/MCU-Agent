# OpenOCD configuration for the Luxiaoban STM32H743ZIT6 board via ST-Link
#
#   openocd -f debug/openocd.cfg                      # start a GDB server
#   openocd -f debug/openocd.cfg -c "program ... "    # flash and exit

source [find interface/stlink.cfg]

# OpenOCD 0.12 deprecated the old "dapdirect_swd" spelling
transport select swd

# STM32H743ZIT6 = 2 MB flash => dual bank
source [find target/stm32h7x_dual_bank.cfg]

# The board only wires SWDIO/SWCLK (no NRST), so rely on a software reset.
reset_config srst_nogate

# 4 MHz is comfortable for an ST-Link v2 clone; raise it if your probe allows.
adapter speed 4000

$_CHIPNAME.cpu0 configure -event gdb-attach {
    echo "Halting target for GDB attach"
    halt
}

$_CHIPNAME.cpu0 configure -event reset-init {
    # H7 errata: the debugger must keep the D1/D3 domains clocked while halted,
    # otherwise SWD drops when the CPU enters a low-power state.
    mmw 0x5C001004 0x00000007 0    ;# DBGMCU_CR |= DBG_STANDBY | DBG_STOP | DBG_SLEEP
}
