# OpenOCD configuration for STM32H743 via ST-Link (SWD)
# Used by Cortex-Debug (VSCode) and by the flash task.

source [find interface/stlink.cfg]
transport select swd

source [find target/stm32h7x.cfg]
reset_config srst_only

# Keep the adapter fast but stable
adapter speed 4000

# Flash + run
init
