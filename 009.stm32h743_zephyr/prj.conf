# =============================================================================
# Zephyr + LVGL OLED project  —  STM32H743ZIT6 / ST7789 240x240 / SD(FatFs) / GBK
# Build: cmake + ninja, toolchain gnuarmemb (arm-none-eabi-gcc)
# Board: nucleo_h743zi (STM32H743ZI, same SoC as the target custom board)
# =============================================================================

# ---- Board / SoC -----------------------------------------------------------
# Board and SoC are selected by the build command (-b nucleo_h743zi/...), not here.

# ---- C library / heap -------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_NEWLIB_LIBC=y

# ---- Kernel / system --------------------------------------------------------
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# ---- Console / debug serial (USART1 PA9/PA10) ------------------------------
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ---- GPIO / LED (system status + OLED backlight) ---------------------------
CONFIG_GPIO=y
CONFIG_LED=y

# ---- SPI + MIPI-DBI (OLED ST7789 over SPI6) -------------------------------
CONFIG_SPI=y
CONFIG_MIPI_DBI=y
CONFIG_DISPLAY=y
CONFIG_ST7789V=y
CONFIG_ST7789V_RGB565=y
CONFIG_DISPLAY_LOG_LEVEL_WRN=y

# ---- LVGL (v8) -------------------------------------------------------------
CONFIG_LVGL=y
# Display is bound via the chosen zephyr,display = &DISPLAY node (no dev-name
# symbol in Zephyr 3.7). We run lv_timer_handler() from our own thread since
# the Zephyr LVGL module does not spawn one automatically.
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_VDB_ALIGN=4
CONFIG_LV_Z_BITS_PER_PIXEL=16
# LVGL object/timer/style heap. The default 2048 B is far too small to create
# a handful of labels + timers and caused a bus fault (wild pointer in
# lv_timer_resume). Give LVGL a dedicated 64 KB heap (static array in lvgl_mem.c).
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_MEM_SIZE_KILOBYTES=32
CONFIG_LV_USE_USER_DATA=y
CONFIG_LV_USE_LABEL=y

# Built-in ASCII font used as fallback for the custom GBK font
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_14=y

# ---- SD card (SDMMC1) + FatFs ---------------------------------------------
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SDMMC_STM32=y
CONFIG_SDMMC_VOLUME_NAME="SD"
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# ---- Build outputs ----------------------------------------------------------
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_BUILD_OUTPUT_HEX=y
