# OpenOCD configuration - STM32H743ZIT6 over ST-Link (SWD)
#
# Usage:
#   openocd -f openocd/stm32h743_stlink.cfg                       # GDB server
#   openocd -f openocd/stm32h743_stlink.cfg -c "program fw.elf verify reset exit"
#
# Note: reset handling is deliberately left at the stm32h7x.cfg default
# (software SYSRESETREQ). Do NOT add "connect_assert_srst" here - it holds the
# core in reset on connect, which makes attaching to an already-running target
# (and cortex-debug's "Attach" configuration) time out.

source [find interface/stlink.cfg]

transport select swd

# 1.8 MHz is a safe SWD speed for an ST-Link v2 clone. The on-board V3 and
# genuine V2 probes handle 4000+ comfortably.
adapter speed 1800

set CHIPNAME stm32h7x
source [find target/stm32h7x.cfg]
