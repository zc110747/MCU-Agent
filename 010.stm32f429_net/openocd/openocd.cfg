# OpenOCD configuration for the STM32F429IGT6 board using an ST-LINK
# (SWD). Invoke from the project root:
#   openocd -f openocd/openocd.cfg
# (Cortex-Debug in VSCode loads this file automatically.)

# --- Debug adapter: ST-LINK (v2 / v3) ---
source [find interface/stlink.cfg]
transport select swd

# --- Target: STM32F4x (Cortex-M4 with FPU) ---
source [find target/stm32f4x.cfg]

# Interface clock (kHz). Lower this if you see "target not halted" issues.
adapter speed 2000

# Let the target come out of reset and halt at main() for flashing/debug.
$_TARGETNAME configure -event reset-init {
    # Enable the FPU (CP10/CP11) so -mfloat-abi=soft is not strictly needed,
    # and so any accidental FP op won't HardFault.
    mww 0xE000ED88 0x00F00000
}
