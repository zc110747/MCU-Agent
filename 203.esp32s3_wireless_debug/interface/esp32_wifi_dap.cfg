# ESP32-S3 Wireless CMSIS-DAP over TCP — OpenOCD interface config
#
# Copy this file to your OpenOCD tcl/interface/ directory, then:
#   openocd -f interface/esp32_wifi_dap.cfg -f target/stm32h7x.cfg
#
# IMPORTANT: Stock OpenOCD (including Sysprogs 0.12.0) has NO "cmsis-dap
# backend tcp" command. To use this cfg you must build OpenOCD from source
# with the cmsis-dap TCP backend enabled (see github.com/bkuschak/
# cmsis_dap_tcp_esp32 README for the matching OpenOCD build). Without that
# backend, connect OpenOCD to the probe over the USB HID interface instead, or
# validate the wireless transport first with tools/wifi_dap_client.py.
#
# Firmware side (components/wifi_dap): ESP32 starts a SoftAP
# "ESP32-DAP-XXXX" at 192.168.4.1 and a TCP server on port 50000. Connect the
# PC to that AP, then point OpenOCD at the AP IP below.

adapter driver cmsis-dap
cmsis-dap backend tcp
cmsis-dap tcp host 192.168.4.1
cmsis-dap tcp port 50000

transport select swd
adapter speed 4000
reset_config none
