# Minimal OpenOCD check for the USB CMSIS-DAP transport.
#
# Purpose: prove that the USB HID link between the PC and the ESP32-S3 probe
# works, WITHOUT needing a real STM32 target attached. OpenOCD performs
# DAP_Info / DAP_Connect / SWD line reset during adapter init; if the USB
# transport is healthy these all return valid data. A failure to find the DP
# afterwards is EXPECTED when no target board is wired up.
#
# Usage:
#   openocd -f tools/verify_usb_hid.cfg
#
# Look for: "CMSIS-DAP: FW Version", "SWD DPIDR" (target present) or
#           "Error connecting DP" (no target - USB link itself is fine).

adapter driver cmsis-dap
transport select swd
adapter speed 1000

# Minimal ARM debug port description; enough to reach the adapter init stage.
swd newdap chip cpu -irlen 4
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap

init
dap info
shutdown
