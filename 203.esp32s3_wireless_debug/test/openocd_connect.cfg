# ============================================================================
# OpenOCD 连接测试配置 - ESP32-S3 CMSIS-DAP 探针
#   用途: 验证探针被 OpenOCD 识别并完成一次 DAP 连接 (读取 DPIDR)。
#   说明: 仅做"连接测试"，完整仿真/下载由用户自行完成。
#   用法: D:/Software/openocd/bin/openocd.exe -f test/openocd_connect.cfg
# ============================================================================

source [find interface/cmsis-dap.cfg]

# 本探针的 VID/PID (见 sdkconfig: DEBUG_PROBE_USB_VID/PID)
cmsis-dap vid_pid 0x303a 0x8502

# 显式选择 SWD, 抑制 auto-select 警告
transport select swd

# 飞线连接先用 100 kHz 验证链路；无飞线时可提高到 1000(1MHz)
# 注意: target/stm32h7x.cfg 内部会把 adapter speed 覆写为 4000，
#       因此必须在 source 之后再次设置才能生效 (实测 4MHz 飞线会读错 DPIDR)
source [find target/stm32h7x.cfg]
adapter speed 100

# 连接后打印 DAP 信息即证明 SWD/JTAG 链路通畅
init
echo "--- CMSIS-DAP probe enumerated, reading DAP info ---"
dap info
echo "--- connection test done ---"
shutdown
