# ============================================================================
# OpenOCD 最小连接测试 - 仅拉起 DAP, 不创建 target (避免 target examine 报错)
# 用途: 干净验证探针枚举 + SWD 链路 + DPIDR 读取, 打印完整 dap info。
# 用法: D:/Software/openocd/bin/openocd.exe -s D:/Software/openocd/share/openocd/scripts -f test/openocd_dap_only.cfg
# ============================================================================

source [find interface/cmsis-dap.cfg]
cmsis-dap vid_pid 0x303a 0x8502
transport select swd
adapter speed 100

# 仅创建 DAP 设备 (不创建 cortex_m target, 故 init 不会尝试 halt 目标)
swd newdap stm32 cpu -enable

init
echo "--- DAP info (DPIDR etc.) ---"
dap info
echo "--- connection test done ---"
shutdown
