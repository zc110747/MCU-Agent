# Standalone STM32H7 SWD connect config for manual OpenOCD runs.
# Usage (from any directory):
#   openocd -f <path-to>/openocd_stm32h7.cfg
# Or with explicit scripts search path:
#   openocd -s <openocd-scripts-dir> -f <path-to>/openocd_stm32h7.cfg
#
# Notes:
# - Keep ONLY ONE debug host attached to the target SWD bus at a time.
#   A J-Link/ST-Link left attached while this probe is connected causes
#   dual-driver contention: deterministic garbage DPIDR reads and AP failures.
# - If the target runs user code that remaps PA13/PA14 or enters low-power,
#   this config relies on the probe firmware's connect-under-reset
#   (nRESET is held low during DAP_Connect bring-up, released only after
#   the core is confirmed halted). No extra reset_config is needed.

source [find interface/cmsis-dap.cfg]

# Probe USB identity (see sdkconfig: DEBUG_PROBE_USB_VID/PID)
cmsis_dap_vid_pid 0x303a 0x8502

# Flying-wire bring-up speed. Raise to 400/1000 only after 100 kHz is proven
# stable (see useage.md clock ladder).
adapter speed 100

source [find target/stm32h7x.cfg]

# stm32h7x.cfg internally sets adapter speed 4000 - re-assert AFTER sourcing it.
adapter speed 100

init
targets
echo "=== SWD connect OK (STM32H7) ==="
shutdown
