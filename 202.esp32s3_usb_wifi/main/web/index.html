<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32-S3 Wi-Fi 配置</title>
<style>
  body { background:#1a1a1a; color:#e0e0e0; font-family:Consolas,Monaco,monospace; margin:0; padding:16px; }
  .card { background:#242424; border:1px solid #333; border-radius:8px; padding:16px; margin-bottom:16px; }
  h1 { font-size:18px; margin:0 0 12px; font-weight:600; }
  h2 { font-size:14px; margin:0 0 10px; font-weight:600; color:#b0b0b0; }
  .row { display:flex; justify-content:space-between; padding:4px 0; font-size:13px; border-bottom:1px solid #2c2c2c; }
  .row .k { color:#888; }
  .row .v { color:#e0e0e0; text-align:right; max-width:60%; overflow:hidden; text-overflow:ellipsis; }
  input { background:#1a1a1a; color:#e0e0e0; border:1px solid #3a3a3a; border-radius:4px; padding:8px; width:100%; box-sizing:border-box; font-family:inherit; margin-bottom:8px; }
  button { background:#2c2c2c; color:#e0e0e0; border:1px solid #3a3a3a; border-radius:4px; padding:8px 16px; cursor:pointer; font-family:inherit; margin-right:8px; }
  button:hover { background:#383838; }
  .ap { padding:8px; border-bottom:1px solid #2c2c2c; cursor:pointer; }
  .ap:hover { background:#2c2c2c; }
  .ap .name { font-size:13px; }
  .ap .meta { font-size:11px; color:#888; margin-top:2px; }
  #msg { font-size:12px; color:#888; margin-top:8px; min-height:16px; }
  .ok { color:#cfcfcf; }
</style>
</head>
<body>
  <div class="card">
    <h1>ESP32-S3 USB Wi-Fi 适配器</h1>
    <div id="status"></div>
  </div>

  <div class="card">
    <h2>扫描 Wi-Fi</h2>
    <button onclick="scanWifi()">扫描</button>
    <div id="scan"></div>
  </div>

  <div class="card">
    <h2>连接</h2>
    <input id="ssid" placeholder="SSID">
    <input id="password" placeholder="Password" type="password">
    <button onclick="connectWifi()">连接</button>
    <div id="msg"></div>
  </div>

  <div class="card">
    <h2>恢复出厂设置</h2>
    <button onclick="factoryReset()">恢复出厂</button>
  </div>

<script>
function esc(s){ return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }

function loadStatus(){
  fetch("/api/status").then(r=>r.json()).then(d=>{
    var h = "";
    h += row("USB", d.usb);
    h += row("RNDIS", d.rndis);
    h += row("Wi-Fi", d.wifi_status);
    h += row("SSID", d.ssid);
    h += row("RSSI", d.rssi);
    h += row("Channel", d.channel);
    h += row("ESP32 Wi-Fi IP", d.wifi_ip);
    h += row("Gateway", d.gateway);
    h += row("DNS", d.dns);
    h += row("USB IP", d.usb_ip);
    h += row("Internet", d.internet);
    document.getElementById("status").innerHTML = h;
  }).catch(()=>{ document.getElementById("status").innerHTML = row("状态","加载失败"); });
}
function row(k,v){ return '<div class="row"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v)+'</span></div>'; }

function scanWifi(){
  document.getElementById("scan").innerHTML = "扫描中...";
  fetch("/api/scan").then(r=>r.json()).then(d=>{
    var h = "";
    for(var i=0;i<d.aps.length;i++){
      var a = d.aps[i];
      h += '<div class="ap" onclick="pick(\''+esc(a.ssid)+'\')"><div class="name">'+esc(a.ssid)+'</div><div class="meta">RSSI '+a.rssi+' | CH '+a.channel+' | '+a.auth+'</div></div>';
    }
    document.getElementById("scan").innerHTML = h || "未发现 AP";
  }).catch(()=>{ document.getElementById("scan").innerHTML = "扫描失败"; });
}

function pick(ssid){ document.getElementById("ssid").value = ssid; }

function connectWifi(){
  var ssid = document.getElementById("ssid").value;
  var pwd = document.getElementById("password").value;
  if(!ssid){ setMsg("请输入 SSID"); return; }
  setMsg("连接中...");
  fetch("/api/connect?ssid="+encodeURIComponent(ssid)+"&password="+encodeURIComponent(pwd)).then(r=>r.json()).then(d=>{
    setMsg(d.result === "ok" ? "已保存并尝试连接" : ("失败: "+d.result));
    setTimeout(loadStatus, 3000);
  }).catch(()=>{ setMsg("请求失败"); });
}

function factoryReset(){
  if(!confirm("确认清除所有 Wi-Fi 配置并重启?")) return;
  setMsg("恢复出厂设置中...");
  fetch("/api/reset").then(()=>{ setMsg("已重置，设备重启中..."); });
}

function setMsg(m){ document.getElementById("msg").innerHTML = '<span class="ok">'+esc(m)+'</span>'; }

loadStatus();
setInterval(loadStatus, 5000);
</script>
</body>
</html>
